  <!-- Analytics (GTM + Meta Pixel) — loaded on the visitor's first scroll/tap/key/mouse move, or 10s
       after page load, so they never slow down the first paint. Events fired before that are queued. -->
  <script>
  (function (w, d) {
    w.dataLayer = w.dataLayer || [];
    w.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
    var n = w.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); };
    if (!w._fbq) w._fbq = n; n.push = n; n.loaded = true; n.version = '2.0'; n.queue = [];
    fbq('init', '1051868494559436');
    fbq('track', 'PageView');
    var done = false, evs = ['pointerdown', 'keydown', 'scroll', 'touchstart', 'mousemove'];
    function add(src, attrs) {
      var s = d.createElement('script'); s.async = true; s.src = src;
      for (var k in attrs || {}) s.setAttribute(k, attrs[k]);
      d.head.appendChild(s);
    }
    function go() {
      if (done) return; done = true;
      evs.forEach(function (e) { w.removeEventListener(e, go); });
      add('https://www.googletagmanager.com/gtm.js?id=GTM-PCJFGFXG');
      add('https://connect.facebook.net/en_US/fbevents.js');
    }
    evs.forEach(function (e) { w.addEventListener(e, go, { passive: true }); });
    w.addEventListener('load', function () { setTimeout(go, 10000); });
  })(window, document);
  </script>

    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 40px 20px; position: relative; overflow: hidden; }
    .nf__bg { position: absolute; inset: 0; z-index: 0; }
    .nf__inner { position: relative; z-index: 1; max-width: 520px; }
    .nf__code { font-family: 'Poppins'; font-weight: 800; font-size: clamp(80px, 18vw, 160px); line-height: 1; letter-spacing: -.04em; }
